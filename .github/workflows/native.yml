name: Native C++11
on:
  push:
    paths: ['native-sdl2/**', 'java-desktop/assets/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native-sdl2/**', 'java-desktop/assets/**', '.github/workflows/native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev zlib1g-dev
      - if: runner.os == 'macOS'
        run: brew install sdl2 zlib
      - run: cmake -S native-sdl2 -B native-sdl2/build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build native-sdl2/build --parallel
      - run: ctest --test-dir native-sdl2/build --output-on-failure
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: vcpkg install sdl2:x64-windows zlib:x64-windows
      - shell: pwsh
        run: cmake -S native-sdl2 -B native-sdl2/build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - run: cmake --build native-sdl2/build --config Release --parallel
      - run: ctest --test-dir native-sdl2/build -C Release --output-on-failure
